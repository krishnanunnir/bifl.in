<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" />
  <rect x="20" y="20" width="360" height="360" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- iPhone 17 Titanium Chassis (Natural Titanium / Slate Tone) -->
  <rect x="135" y="65" width="130" height="255" rx="26" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" />
  
  <!-- Outer Titanium Chamfer / Band -->
  <rect x="137" y="67" width="126" height="251" rx="24" fill="#0f172a" />
  
  <!-- Front OLED Display Glass (OLED Black) -->
  <rect x="140" y="70" width="120" height="245" rx="21" fill="#020617" />
  
  <!-- Dynamic Island -->
  <rect x="180" y="78" width="40" height="12" rx="6" fill="#000000" stroke="#1e293b" stroke-width="0.75" />
  <!-- Front Camera Lens -->
  <circle cx="212" cy="84" r="3" fill="#0f172a" />
  <circle cx="212" cy="84" r="1.5" fill="#1e293b" />
  
  <!-- Screen Wallpaper Gradient / Subtle Glow -->
  <circle cx="200" cy="190" r="45" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  <circle cx="200" cy="190" r="30" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4" />
  
  <!-- iOS Lock Screen Time Display -->
  <text x="200" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">9:41</text>
  <text x="200" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.5">WEDNESDAY, SEPTEMBER 2</text>
  
  <!-- Action Button on Left Edge -->
  <rect x="133" y="105" width="2" height="14" rx="1" fill="#475569" />
  <!-- Volume Up / Down -->
  <rect x="133" y="125" width="2" height="22" rx="1" fill="#475569" />
  <rect x="133" y="152" width="2" height="22" rx="1" fill="#475569" />
  
  <!-- Power Button on Right Edge -->
  <rect x="265" y="120" width="2" height="30" rx="1" fill="#475569" />
  
  <!-- Home Indicator Bar at Bottom -->
  <rect x="182" y="306" width="36" height="3" rx="1.5" fill="#e2e8f0" opacity="0.8" />
  
  <!-- Badge / Product Label -->
  <text x="200" y="360" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">APPLE IPHONE 17 · TITANIUM BIFL</text>
</svg>
